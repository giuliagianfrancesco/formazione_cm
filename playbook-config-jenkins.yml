---
- name: configurazione jenkins container
  hosts: jenkins_cont
  become: true
  gather_facts: false
  vars:
    ansible_connection: docker
    ansible_python_interpreter: /usr/bin/python3 
  tasks:
    - name: Installa python
      ansible.builtin.raw: apt-get update && apt-get install -y python3 python3-pip
  
    - name: Aggiorna cache apt
      ansible.builtin.apt:
        update_cache: true
    - name: Installa client Docker e Ansible
      ansible.builtin.apt:
        name:
          - ansible
          - docker.io
        state: present
    - name: Copia chiave privata SSH dentro Jenkins
      ansible.builtin.copy:
        src: ~/.ssh/id_ed25519
        dest: /root/.ssh/id_ed25519
        mode: '0600'
